<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新芽 · 灵感备忘录 · 云端同步</title>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js">
    </script>
    <style>
        /* ===== 所有样式与之前完全相同 ===== */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#eaf6ed;background-image:radial-gradient(circle at 10% 20%,rgba(120,200,150,0.08) 0%,transparent 60%),radial-gradient(circle at 90% 80%,rgba(80,180,120,0.06) 0%,transparent 50%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
        .app{max-width:1200px;width:100%;background:rgba(255,255,255,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:32px;border:1px solid rgba(100,190,140,0.25);box-shadow:0 20px 60px rgba(60,140,100,0.08),0 8px 24px rgba(60,140,100,0.04);overflow:hidden;transition:all .2s}
        .header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid rgba(100,190,140,0.15);background:rgba(255,255,255,0.3);backdrop-filter:blur(4px);flex-wrap:wrap;gap:8px}
        .header h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;color:#1f4a33}
        .header h1 .icon-leaf{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:linear-gradient(145deg,#5cb885,#3da06a);border-radius:8px;color:#fff;font-size:16px;box-shadow:0 4px 12px rgba(60,180,110,0.2)}
        .header h1 span{background:rgba(60,180,110,0.12);font-size:11px;font-weight:400;color:#2a6b47;padding:2px 12px;border-radius:40px;border:1px solid rgba(60,180,110,0.08)}
        .header-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        .btn{background:0 0;border:none;padding:6px 16px;border-radius:40px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:5px}
        .btn-primary{background:linear-gradient(145deg,#4caf7a,#3a9a65);color:#fff;box-shadow:0 4px 14px rgba(60,180,110,0.2)}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(60,180,110,0.3)}
        .btn-primary:active{transform:scale(.96)}
        .btn-outline{background:rgba(60,180,110,0.06);border:1px solid rgba(60,180,110,0.15);color:#2a6b47}
        .btn-outline:hover{background:rgba(60,180,110,0.12)}
        .btn-danger{background:rgba(220,80,80,0.06);border:1px solid rgba(220,80,80,0.12);color:#b34a4a}
        .btn-danger:hover{background:rgba(220,80,80,0.12)}
        .sync-badge{font-size:10px;padding:3px 12px;border-radius:40px;background:rgba(60,180,110,0.10);color:#2a6b47;border:1px solid rgba(60,180,110,0.08);display:inline-flex;align-items:center;gap:5px}
        .sync-badge .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3a9a65}
        .sync-badge .dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
        .sync-badge .dot.error{background:#ef4444}
        .sync-badge .dot.offline{background:#9ca3af}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .api-bar{display:flex;gap:6px;padding:6px 24px;background:rgba(240,250,243,0.3);border-bottom:1px solid rgba(100,190,140,0.06);flex-wrap:wrap;align-items:center}
        .api-bar input{flex:1;min-width:120px;padding:5px 12px;border:1px solid rgba(100,190,140,0.15);border-radius:10px;font-size:12px;outline:0;background:rgba(255,255,255,0.4);transition:.2s;font-family:inherit}
        .api-bar input:focus{border-color:#3a9a65;background:rgba(255,255,255,0.7);box-shadow:0 0 0 3px rgba(60,180,110,0.06)}
        .api-bar input::placeholder{color:rgba(0,0,0,0.25);font-size:11px}
        .api-bar .api-status{font-size:10px;color:#5a8f72;padding:2px 10px;border-radius:20px;background:rgba(60,180,110,0.06)}
        .api-bar .api-status.ready{color:#2a6b47;background:rgba(60,180,110,0.12)}
        .api-bar .api-status.error{color:#b34a4a;background:rgba(220,80,80,0.08)}
        .main{display:flex;flex-direction:row;min-height:380px;background:0 0}
        .timeline{width:180px;background:rgba(240,250,243,0.3);border-right:1px solid rgba(100,190,140,0.08);padding:16px 12px;flex-shrink:0;overflow-y:auto;max-height:480px}
        .timeline-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#5a8f72;font-weight:600;margin-bottom:14px;padding-left:4px}
        .timeline-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;padding:3px 8px 3px 4px;border-radius:12px;transition:.1s;cursor:default}
        .timeline-item.active{background:rgba(60,180,110,0.08)}
        .timeline-dot{width:8px;height:8px;background:#b8d9c8;border-radius:50%;margin-top:4px;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px #b8d9c8;transition:.15s}
        .timeline-item.active .timeline-dot{background:#3a9a65;box-shadow:0 0 0 2px #3a9a65}
        .timeline-content{display:flex;flex-direction:column}
        .timeline-date{font-size:11px;font-weight:500;color:#1f4a33;line-height:1.3}
        .timeline-time{font-size:10px;color:#6d9f82}
        .list-area{flex:1;padding:16px 24px 24px;background:0 0;overflow-y:auto;max-height:480px}
        .list-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:6px}
        .list-header h2{font-size:15px;font-weight:500;color:#1f4a33}
        .list-header .count{font-size:11px;color:#5a8f72;background:rgba(60,180,110,0.08);padding:2px 12px;border-radius:30px;border:1px solid rgba(60,180,110,0.06)}
        .entry-card{background:rgba(255,255,255,0.5);backdrop-filter:blur(4px);border:1px solid rgba(100,190,140,0.12);border-radius:18px;padding:14px 20px;margin-bottom:10px;transition:all .2s;cursor:pointer;box-shadow:0 2px 8px rgba(60,140,100,0.02)}
        .entry-card:hover{border-color:rgba(60,180,110,0.3);background:rgba(255,255,255,0.7);transform:translateY(-2px);box-shadow:0 12px 32px rgba(60,140,100,0.06)}
        .entry-card .title{font-size:16px;font-weight:600;color:#1f4a33;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .entry-card .title .tags{display:flex;gap:4px;flex-wrap:wrap}
        .entry-card .title .tag{font-size:9px;background:rgba(60,180,110,0.10);color:#2a6b47;padding:1px 8px;border-radius:20px;font-weight:400;border:1px solid rgba(60,180,110,0.06)}
        .entry-card .preview{margin-top:4px;font-size:13px;color:#3a6b55;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .entry-card .meta{margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#6d9f82;border-top:1px solid rgba(100,190,140,0.06);padding-top:8px;flex-wrap:wrap;gap:4px}
        .entry-card .meta .summary-badge{background:rgba(60,180,110,0.08);padding:2px 10px;border-radius:40px;color:#2a6b47;font-weight:450;border:1px solid rgba(60,180,110,0.06);font-size:9px}
        .entry-card .meta .summary-badge.loading{background:rgba(245,158,11,0.08);color:#b45309;border-color:rgba(245,158,11,0.1)}
        .entry-card .meta .summary-badge.error{background:rgba(220,80,80,0.08);color:#b34a4a;border-color:rgba(220,80,80,0.08)}
        .detail-overlay{position:fixed;inset:0;background:rgba(30,70,50,0.2);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
        .detail-overlay.open{display:flex}
        .detail-panel{background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);max-width:720px;width:100%;border-radius:28px;padding:24px 28px;box-shadow:0 40px 80px rgba(30,80,55,0.12);animation:slideUp .25s ease;max-height:92vh;overflow-y:auto;border:1px solid rgba(100,190,140,0.12)}
        @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .detail-panel .close-btn{float:right;background:0 0;border:none;font-size:20px;color:#6d9f82;cursor:pointer;padding:2px 6px;border-radius:40px;transition:.1s}
        .detail-panel .close-btn:hover{background:rgba(60,180,110,0.06);color:#1f4a33}
        .detail-panel .detail-title-input{font-size:22px;font-weight:600;margin:4px 0 10px;color:#1f4a33;width:100%;border:none;background:0 0;outline:0;border-bottom:2px solid transparent;padding:4px 0;transition:.2s;font-family:inherit}
        .detail-panel .detail-title-input:focus{border-bottom-color:#3a9a65}
        .detail-panel .detail-tags-section{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 12px;align-items:center}
        .detail-panel .detail-tags-section .tag-item{font-size:11px;background:rgba(60,180,110,0.10);color:#2a6b47;padding:2px 10px;border-radius:20px;border:1px solid rgba(60,180,110,0.10);display:inline-flex;align-items:center;gap:4px}
        .detail-panel .detail-tags-section .tag-item .del-tag{cursor:pointer;font-size:11px;color:#b34a4a;background:0 0;border:none;padding:0 2px}
        .detail-panel .detail-tags-section .tag-item .del-tag:hover{color:#dc2626}
        .detail-panel .detail-tags-section .add-tag-input{border:1px dashed rgba(60,180,110,0.2);border-radius:20px;padding:2px 10px;font-size:11px;background:0 0;outline:0;width:70px;transition:.2s;font-family:inherit}
        .detail-panel .detail-tags-section .add-tag-input:focus{border-color:#3a9a65;width:110px;background:rgba(255,255,255,0.5)}
        .detail-panel .detail-tags-section .add-tag-btn{background:rgba(60,180,110,0.08);border:none;border-radius:20px;padding:2px 8px;font-size:11px;color:#2a6b47;cursor:pointer;transition:.2s}
        .detail-panel .detail-tags-section .add-tag-btn:hover{background:rgba(60,180,110,0.18)}
        .detail-panel .detail-content-textarea{width:100%;padding:14px 18px;border:1px solid rgba(100,190,140,0.12);border-radius:14px;font-size:14px;line-height:1.6;color:#1f4a33;margin:10px 0 14px;resize:vertical;min-height:90px;font-family:inherit;background:rgba(240,250,243,0.3);transition:.2s;outline:0}
        .detail-panel .detail-content-textarea:focus{border-color:#3a9a65;background:rgba(255,255,255,0.6);box-shadow:0 0 0 4px rgba(60,180,110,0.06)}
        .detail-panel .detail-summary-box{background:rgba(60,180,110,0.05);padding:14px 18px;border-radius:14px;border-left:3px solid #3a9a65;margin:6px 0 14px}
        .detail-panel .detail-summary-box .summary-label{font-size:11px;font-weight:500;color:#2a6b47;display:flex;justify-content:space-between;align-items:center}
        .detail-panel .detail-summary-box .summary-label .regenerate-btn{font-size:10px;background:rgba(60,180,110,0.08);border:none;border-radius:20px;padding:2px 10px;color:#2a6b47;cursor:pointer;transition:.2s}
        .detail-panel .detail-summary-box .summary-label .regenerate-btn:hover{background:rgba(60,180,110,0.18)}
        .detail-panel .detail-summary-box .summary-label .regenerate-btn:disabled{opacity:.5;cursor:not-allowed}
        .detail-panel .detail-summary-box .summary-text{font-size:14px;color:#1f4a33;line-height:1.5;margin-top:4px}
        .detail-panel .detail-summary-box .summary-text.loading{color:#b45309;font-style:italic}
        .detail-panel .detail-summary-box .summary-text.error{color:#b34a4a}
        .detail-panel .detail-timestamp{font-size:11px;color:#6d9f82;margin-top:6px}
        .detail-panel .detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;border-top:1px solid rgba(100,190,140,0.06);padding-top:14px}
        .detail-panel .detail-actions .btn{font-size:11px;padding:5px 14px}
        .modal-overlay{position:fixed;inset:0;background:rgba(30,70,50,0.2);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
        .modal-overlay.open{display:flex}
        .modal-box{background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border-radius:28px;max-width:560px;width:100%;padding:28px 32px;box-shadow:0 40px 80px rgba(30,80,55,0.12);animation:slideUp .25s ease;border:1px solid rgba(100,190,140,0.12)}
        .modal-box h3{font-size:20px;font-weight:600;margin-bottom:20px;color:#1f4a33}
        .modal-box label{display:block;font-size:13px;font-weight:500;color:#2a6b47;margin-bottom:4px;margin-top:14px}
        .modal-box input,.modal-box textarea{width:100%;padding:12px 16px;border:1px solid rgba(100,190,140,0.15);border-radius:14px;font-size:14px;transition:.15s;background:rgba(255,255,255,0.5);font-family:inherit}
        .modal-box input:focus,.modal-box textarea:focus{outline:0;border-color:#3a9a65;background:#fff;box-shadow:0 0 0 4px rgba(60,180,110,0.06)}
        .modal-box textarea{min-height:100px;resize:vertical}
        .modal-box .modal-tags-section{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
        .modal-box .modal-tags-section .tag-pill{font-size:11px;background:rgba(60,180,110,0.10);color:#2a6b47;padding:2px 10px;border-radius:20px;border:1px solid rgba(60,180,110,0.08);display:inline-flex;align-items:center;gap:4px}
        .modal-box .modal-tags-section .tag-pill .remove-tag{cursor:pointer;font-size:10px;color:#b34a4a;background:0 0;border:none;padding:0 2px}
        .modal-box .modal-tags-section .tag-input{border:1px dashed rgba(60,180,110,0.2);border-radius:20px;padding:2px 10px;font-size:11px;background:0 0;outline:0;width:60px;transition:.2s;font-family:inherit}
        .modal-box .modal-tags-section .tag-input:focus{border-color:#3a9a65;width:100px}
        .modal-box .modal-tags-section .add-tag-btn{background:rgba(60,180,110,0.06);border:none;border-radius:20px;padding:2px 8px;font-size:11px;color:#2a6b47;cursor:pointer}
        .modal-box .modal-tags-section .add-tag-btn:hover{background:rgba(60,180,110,0.14)}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
        .empty-state{text-align:center;padding:50px 16px;color:#6d9f82}
        .empty-state .big-icon{font-size:40px;margin-bottom:12px}
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) scale(.9);background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);color:#fff;padding:6px 18px;border-radius:12px;font-size:12px;z-index:9999;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;max-width:90%}
        .toast.show{opacity:1;transform:translateX(-50%) scale(1)}
        @media (max-width:768px){.main{flex-direction:column}.timeline{width:100%;border-right:0;border-bottom:1px solid rgba(100,190,140,0.08);max-height:100px;display:flex;flex-wrap:nowrap;gap:8px;padding:10px 14px;overflow-x:auto;background:rgba(240,250,243,0.2)}.timeline-title{display:none}.timeline-item{flex-shrink:0;margin-bottom:0;padding:3px 10px 3px 6px;background:rgba(255,255,255,0.3);border-radius:40px;border:1px solid rgba(100,190,140,0.06)}.timeline-item.active{background:rgba(60,180,110,0.08);border-color:#3a9a65}.timeline-dot{width:6px;height:6px;margin-top:4px}.timeline-date{font-size:10px}.timeline-time{font-size:9px}.header{padding:10px 16px}.header h1{font-size:16px}.list-area{padding:12px 16px 16px;max-height:420px}.detail-panel{padding:18px 20px}.modal-box{padding:20px 22px}.api-bar{padding:4px 16px}.api-bar input{min-width:80px;font-size:11px}}
        @media (max-width:480px){body{padding:6px}.app{border-radius:24px}.header-actions .btn{font-size:11px;padding:4px 12px}.entry-card{padding:12px 16px}.entry-card .title{font-size:14px}.entry-card .preview{font-size:12px}.detail-panel .detail-title-input{font-size:18px}}
    </style>
</head>
<body>

    <div class="app">
        <header class="header">
            <h1>
                <span class="icon-leaf">🌱</span>
                灵感备忘录
                <span>云端同步 · 调试版</span>
            </h1>
            <div class="header-actions">
                <span class="sync-badge" id="syncBadge">
                    <span class="dot" id="syncDot"></span>
                    <span id="syncText">已同步</span>
                </span>
                <button class="btn btn-primary" id="newEntryBtn">＋ 新记录</button>
                <button class="btn btn-outline" id="syncBtn">⟳ 同步</button>
            </div>
        </header>

        <div class="api-bar">
            <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API Key (sk-...)" />
            <button class="btn btn-outline" id="saveKeyBtn" style="padding:4px 14px;font-size:11px;">保存</button>
            <span class="api-status" id="apiStatus">⚪ 未配置</span>
        </div>

        <div class="main">
            <div class="timeline" id="timelineContainer">
                <div class="timeline-title">⏳ 时间轴</div>
            </div>
            <div class="list-area" id="listArea">
                <div class="list-header">
                    <h2>🌿 所有灵感</h2>
                    <span class="count" id="entryCount">0 条</span>
                </div>
                <div id="entryList"></div>
            </div>
        </div>
    </div>

    <!-- ===== 详情弹窗 ===== -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-panel">
            <button class="close-btn" id="closeDetailBtn">✕</button>
            <input class="detail-title-input" id="detailTitleInput" placeholder="输入标题..." />
            <div class="detail-tags-section" id="detailTagsSection"></div>
            <textarea class="detail-content-textarea" id="detailContentTextarea" placeholder="输入内容..."></textarea>
            <div class="detail-summary-box">
                <div class="summary-label">
                    <span>🧠 AI 总结</span>
                    <button class="regenerate-btn" id="regenerateSummaryBtn">⟳ 重新生成</button>
                </div>
                <div class="summary-text" id="detailSummaryText">点击「重新生成」或保存时自动生成</div>
            </div>
            <div class="detail-timestamp" id="detailTimestamp"></div>
            <div class="detail-actions">
                <button class="btn btn-primary" id="saveDetailBtn">💾 保存</button>
                <button class="btn btn-danger" id="deleteDetailBtn">🗑️ 删除</button>
            </div>
        </div>
    </div>

    <!-- ===== 新建记录弹窗 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3>✍️ 记录灵感</h3>
            <label>标题</label>
            <input type="text" id="inputTitle" placeholder="给灵感起个标题…" />
            <label>标签</label>
            <div class="modal-tags-section" id="modalTagsSection">
                <input class="tag-input" id="modalTagInput" placeholder="添加标签" />
                <button class="add-tag-btn" id="modalAddTagBtn">＋ 添加</button>
            </div>
            <label>内容</label>
            <textarea id="inputContent" placeholder="写下你突如其来的想法…"></textarea>
            <div class="modal-actions">
                <button class="btn btn-outline" id="cancelModalBtn">取消</button>
                <button class="btn btn-primary" id="saveEntryBtn">💾 保存并生成总结</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  配置 - 使用您的环境 ID
        // ============================================================
        var ENV_ID = 'deepseek-chat-d5gg0748z3b9dfe24';
        var COLLECTION_NAME = 'inspiration_entries';

        // ============================================================
        //  状态
        // ============================================================
        var entries = [];
        var currentEditId = null;
        var modalTags = [];
        var isCloudReady = false;
        var isSyncing = false;
        var isGeneratingSummary = false;

        // 调试日志开关
        var DEBUG = true;

        function log(msg, data) {
            if (DEBUG) {
                if (data) {
                    console.log('🔍 [调试] ' + msg, data);
                } else {
                    console.log('🔍 [调试] ' + msg);
                }
            }
        }

        // ============================================================
        //  DOM 引用
        // ============================================================
        var apiKeyInput = document.getElementById('apiKeyInput');
        var saveKeyBtn = document.getElementById('saveKeyBtn');
        var apiStatus = document.getElementById('apiStatus');
        var syncBadge = document.getElementById('syncBadge');
        var syncDot = document.getElementById('syncDot');
        var syncText = document.getElementById('syncText');
        var syncBtn = document.getElementById('syncBtn');
        var newEntryBtn = document.getElementById('newEntryBtn');
        var entryList = document.getElementById('entryList');
        var entryCount = document.getElementById('entryCount');
        var timelineContainer = document.getElementById('timelineContainer');
        var toast = document.getElementById('toast');

        var detailOverlay = document.getElementById('detailOverlay');
        var closeDetailBtn = document.getElementById('closeDetailBtn');
        var detailTitleInput = document.getElementById('detailTitleInput');
        var detailTagsSection = document.getElementById('detailTagsSection');
        var detailContentTextarea = document.getElementById('detailContentTextarea');
        var detailSummaryText = document.getElementById('detailSummaryText');
        var detailTimestamp = document.getElementById('detailTimestamp');
        var saveDetailBtn = document.getElementById('saveDetailBtn');
        var deleteDetailBtn = document.getElementById('deleteDetailBtn');
        var regenerateSummaryBtn = document.getElementById('regenerateSummaryBtn');

        var modalOverlay = document.getElementById('modalOverlay');
        var inputTitle = document.getElementById('inputTitle');
        var inputContent = document.getElementById('inputContent');
        var modalTagsSection = document.getElementById('modalTagsSection');
        var modalTagInput = document.getElementById('modalTagInput');
        var modalAddTagBtn = document.getElementById('modalAddTagBtn');
        var cancelModalBtn = document.getElementById('cancelModalBtn');
        var saveEntryBtn = document.getElementById('saveEntryBtn');

        // ============================================================
        //  Toast
        // ============================================================
        var toastTimer = null;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function generateId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
        }

        function getApiKey() {
            return localStorage.getItem('deepseek_api_key') || '';
        }

        function setApiKey(key) {
            localStorage.setItem('deepseek_api_key', key);
        }

        // ============================================================
        //  腾讯云初始化（带详细日志）
        // ============================================================
        var cloudApp = null;
        var cloudDb = null;

        async function initCloud() {
            log('开始初始化云端...');
            try {
                if (typeof cloudbase === 'undefined') {
                    log('❌ cloudbase SDK 未加载');
                    isCloudReady = false;
                    updateSyncStatus('offline');
                    return false;
                }
                log('✅ cloudbase SDK 已加载');

                cloudApp = cloudbase.init({ env: ENV_ID });
                log('✅ cloudbase 初始化完成，环境 ID: ' + ENV_ID);

                var auth = cloudApp.auth();
                var loginState = await auth.getLoginState();
                log('当前登录状态:', loginState);

                if (!loginState) {
                    log('未登录，尝试匿名登录...');
                    await auth.anonymousAuthProvider().signIn();
                    log('✅ 匿名登录成功');
                } else {
                    log('✅ 已登录');
                }

                cloudDb = cloudApp.database();
                isCloudReady = true;
                updateSyncStatus('synced');
                log('✅ 云端初始化成功');
                return true;
            } catch (e) {
                log('❌ 云端初始化失败: ' + e.message);
                console.error(e);
                isCloudReady = false;
                updateSyncStatus('offline');
                return false;
            }
        }

        // ============================================================
        //  云端数据操作（带详细日志）
        // ============================================================
        async function loadFromCloud() {
            log('开始从云端拉取数据...');
            if (!isCloudReady || !cloudDb) {
                log('❌ 云端未就绪，无法拉取');
                return null;
            }
            try {
                updateSyncStatus('syncing');
                var collection = cloudDb.collection(COLLECTION_NAME);
                log('查询集合: ' + COLLECTION_NAME);

                var res = await collection
                    .orderBy('updateTime', 'desc')
                    .limit(500)
                    .get();

                log('云端返回结果:', res);

                if (res.data && res.data.length > 0) {
                    log('✅ 从云端拉取到 ' + res.data.length + ' 条记录');
                    return res.data.map(function(item) {
                        return {
                            id: item.id || item._id,
                            title: item.title || '未命名',
                            content: item.content || '',
                            summary: item.summary || '',
                            tags: item.tags || [],
                            timestamp: item.timestamp || new Date().toISOString(),
                            updateTime: item.updateTime || new Date().toISOString(),
                            _cloudId: item._id
                        };
                    });
                } else {
                    log('⚠️ 云端暂无数据');
                    return [];
                }
            } catch (e) {
                log('❌ 拉取云端数据失败: ' + e.message);
                console.error(e);
                updateSyncStatus('error');
                return null;
            }
        }

        async function syncToCloud(entriesData) {
            log('开始同步到云端，共 ' + entriesData.length + ' 条记录');
            if (!isCloudReady || !cloudDb) {
                log('❌ 云端未就绪，无法同步');
                return false;
            }
            if (isSyncing) {
                log('⚠️ 正在同步中，跳过');
                return false;
            }
            try {
                isSyncing = true;
                updateSyncStatus('syncing');
                var collection = cloudDb.collection(COLLECTION_NAME);
                log('集合: ' + COLLECTION_NAME);

                // 先查询现有数据
                var existing = await collection.limit(500).get();
                var existingData = existing.data || [];
                log('云端现有 ' + existingData.length + ' 条记录');

                // 删除所有现有数据
                for (var i = 0; i < existingData.length; i++) {
                    var item = existingData[i];
                    if (item._id) {
                        try {
                            await collection.doc(item._id).remove();
                            log('已删除旧记录: ' + item._id);
                        } catch (e) {
                            log('⚠️ 删除失败: ' + e.message);
                        }
                    }
                }

                // 上传新数据
                for (var j = 0; j < entriesData.length; j++) {
                    var entry = entriesData[j];
                    var result = await collection.add({
                        id: entry.id,
                        title: entry.title || '未命名',
                        content: entry.content || '',
                        summary: entry.summary || '',
                        tags: entry.tags || [],
                        timestamp: entry.timestamp || new Date().toISOString(),
                        updateTime: new Date().toISOString()
                    });
                    log('✅ 已上传记录: ' + entry.id + ' (title: ' + entry.title + ')');
                }

                log('✅ 同步完成，共上传 ' + entriesData.length + ' 条记录');
                updateSyncStatus('synced');
                isSyncing = false;
                return true;
            } catch (e) {
                log('❌ 同步到云端失败: ' + e.message);
                console.error(e);
                updateSyncStatus('error');
                isSyncing = false;
                return false;
            }
        }

        // ============================================================
        //  同步状态UI
        // ============================================================
        function updateSyncStatus(status) {
            syncDot.className = 'dot';
            if (status === 'synced') {
                syncDot.className = 'dot';
                syncText.textContent = '已同步';
                syncBadge.style.opacity = '1';
            } else if (status === 'syncing') {
                syncDot.className = 'dot syncing';
                syncText.textContent = '同步中...';
            } else if (status === 'error') {
                syncDot.className = 'dot error';
                syncText.textContent = '同步失败';
            } else if (status === 'offline') {
                syncDot.className = 'dot offline';
                syncText.textContent = '离线模式';
            }
        }

        // ============================================================
        //  本地数据管理
        // ============================================================
        function loadLocalData() {
            var stored = localStorage.getItem('inspiration_entries_cloud');
            if (stored) {
                try {
                    entries = JSON.parse(stored);
                    log('从本地加载 ' + entries.length + ' 条记录');
                    return true;
                } catch (e) { entries = []; }
            }
            log('本地无数据');
            return false;
        }

        function saveLocalData() {
            localStorage.setItem('inspiration_entries_cloud', JSON.stringify(entries));
            log('保存到本地 ' + entries.length + ' 条记录');
        }

        // ============================================================
        //  DeepSeek 总结生成
        // ============================================================
        async function generateSummary(content, title) {
            var apiKey = getApiKey();
            if (!apiKey) {
                return { success: false, error: '请先配置 API Key' };
            }

            var prompt = '请根据以下内容，生成一个简洁的总结（50字以内），只输出总结内容，不要加任何前缀：\n\n标题：' + (title ||
                '未命名') + '\n内容：' + content;

            try {
                var response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: 'deepseek-v4-flash',
                        messages: [
                            { role: 'system', content: '你是一个简洁的总结助手，只输出总结内容，不要加任何前缀。' },
                            { role: 'user', content: prompt }
                        ],
                        max_tokens: 150,
                        temperature: 0.5
                    })
                });

                var data = await response.json();

                if (!response.ok) {
                    var errMsg = data.error ? data.error.message : '请求失败';
                    if (response.status === 401 || response.status === 403) {
                        setApiKey('');
                        apiKeyInput.value = '';
                        updateApiStatus(false);
                        return { success: false, error: 'API Key 无效，请重新输入' };
                    }
                    return { success: false, error: errMsg };
                }

                if (data.choices && data.choices[0]) {
                    return { success: true, summary: data.choices[0].message.content.trim() };
                }
                return { success: false, error: 'API 返回异常' };
            } catch (error) {
                return { success: false, error: error.message || '网络请求失败' };
            }
        }

        // ============================================================
        //  API Key 状态
        // ============================================================
        function updateApiStatus(hasKey) {
            if (hasKey) {
                apiStatus.textContent = '✅ 已配置';
                apiStatus.className = 'api-status ready';
            } else {
                apiStatus.textContent = '⚪ 未配置';
                apiStatus.className = 'api-status';
            }
        }

        // ============================================================
        //  渲染
        // ============================================================
        function render() {
            var sorted = [...entries].sort(function(a, b) {
                var timeA = new Date(a.timestamp || a.updateTime || 0).getTime();
                var timeB = new Date(b.timestamp || b.updateTime || 0).getTime();
                return timeB - timeA;
            });

            entryCount.textContent = entries.length + ' 条';

            if (entries.length === 0) {
                entryList.innerHTML =
                    '<div class="empty-state"><div class="big-icon">🌱</div><p>还没有灵感记录<br>点击「新记录」开始吧</p></div>';
            } else {
                var listHtml = '';
                for (var i = 0; i < sorted.length; i++) {
                    var entry = sorted[i];
                    var tagsHtml = '';
                    if (entry.tags && entry.tags.length > 0) {
                        tagsHtml = '<span class="tags">';
                        for (var t = 0; t < entry.tags.length; t++) {
                            tagsHtml += '<span class="tag">' + escapeHtml(entry.tags[t]) + '</span>';
                        }
                        tagsHtml += '</span>';
                    }
                    var summaryClass = entry.summary ? '' : ' loading';
                    var summaryText = entry.summary ? '🧠 有总结' : '⏳ 待总结';
                    listHtml +=
                        '<div class="entry-card" data-id="' + entry.id +
                        '"><div class="title">💡 ' + escapeHtml(entry.title || '未命名') + tagsHtml +
                        '</div><div class="preview">' + escapeHtml(entry.content || '') +
                        '</div><div class="meta"><span>' + formatTime(entry.timestamp || entry.updateTime) +
                        '</span><span class="summary-badge' + summaryClass + '">' + summaryText + '</span></div></div>';
                }
                entryList.innerHTML = listHtml;
            }

            var timelineHtml = '<div class="timeline-title">⏳ 时间轴</div>';
            if (sorted.length === 0) {
                timelineHtml += '<div style="padding:12px;color:#6d9f82;font-size:12px;">暂无记录</div>';
            } else {
                var recent = sorted.slice(0, 15);
                for (var k = 0; k < recent.length; k++) {
                    var entry = recent[k];
                    var dateObj = new Date(entry.timestamp || entry.updateTime || Date.now());
                    var dateStr = dateObj.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
                    var timeStr = dateObj.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit',
                        hour12: false });
                    timelineHtml +=
                        '<div class="timeline-item" data-id="' + entry.id +
                        '"><div class="timeline-dot"></div><div class="timeline-content"><div class="timeline-date">' +
                        dateStr + '</div><div class="timeline-time">' + timeStr + '</div></div></div>';
                }
            }
            timelineContainer.innerHTML = timelineHtml;

            var cards = document.querySelectorAll('.entry-card');
            for (var c = 0; c < cards.length; c++) {
                cards[c].addEventListener('click', function() {
                    var id = this.dataset.id;
                    openDetail(id);
                });
            }

            var items = document.querySelectorAll('.timeline-item');
            for (var m = 0; m < items.length; m++) {
                items[m].addEventListener('click', function() {
                    var id = this.dataset.id;
                    openDetail(id);
                });
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(iso) {
            if (!iso) return '未知时间';
            try {
                var d = new Date(iso);
                return d.toLocaleString('zh-CN', { hour12: false });
            } catch {
                return iso;
            }
        }

        // ============================================================
        //  详情操作
        // ============================================================
        function openDetail(id) {
            var entry = null;
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].id === id) { entry = entries[i]; break; }
            }
            if (!entry) { showToast('记录不存在'); return; }

            currentEditId = id;
            detailTitleInput.value = entry.title || '';
            detailContentTextarea.value = entry.content || '';
            detailSummaryText.textContent = entry.summary || '点击「重新生成」或保存时自动生成';
            detailSummaryText.className = 'summary-text' + (entry.summary ? '' : ' loading');
            detailTimestamp.textContent = formatTime(entry.timestamp || entry.updateTime);

            renderDetailTags(entry.tags || []);

            detailOverlay.classList.add('open');
        }

        function renderDetailTags(tags) {
            detailTagsSection.innerHTML = '';
            for (var i = 0; i < (tags || []).length; i++) {
                var tag = tags[i];
                var span = document.createElement('span');
                span.className = 'tag-item';
                span.innerHTML = escapeHtml(tag) +
                    ' <button class="del-tag" data-tag="' + escapeHtml(tag) + '">✕</button>';
                detailTagsSection.appendChild(span);
            }

            var input = document.createElement('input');
            input.className = 'add-tag-input';
            input.placeholder = '添加标签';
            input.id = 'detailTagInput';
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addDetailTag();
                }
            });

            var addBtn = document.createElement('button');
            addBtn.className = 'add-tag-btn';
            addBtn.textContent = '＋';
            addBtn.addEventListener('click', addDetailTag);

            detailTagsSection.appendChild(input);
            detailTagsSection.appendChild(addBtn);

            var delBtns = document.querySelectorAll('#detailTagsSection .del-tag');
            for (var j = 0; j < delBtns.length; j++) {
                delBtns[j].addEventListener('click', function() {
                    var tag = this.dataset.tag;
                    removeDetailTag(tag);
                });
            }
        }

        function addDetailTag() {
            var input = document.getElementById('detailTagInput');
            if (!input) return;
            var tag = input.value.trim();
            if (!tag) return;
            if (tag.length > 20) { showToast('标签不能超过20个字符'); return; }

            var entry = null;
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].id === currentEditId) { entry = entries[i]; break; }
            }
            if (!entry) return;
            if (!entry.tags) entry.tags = [];
            for (var j = 0; j < entry.tags.length; j++) {
                if (entry.tags[j] === tag) { showToast('标签已存在'); return; }
            }

            entry.tags.push(tag);
            entry.updateTime = new Date().toISOString();
            saveLocalData();
            renderDetailTags(entry.tags);
            render();
            if (isCloudReady) {
                log('标签变更，触发同步...');
                syncToCloud(entries);
            }
            showToast('✅ 标签已添加');
            input.value = '';
        }

        function removeDetailTag(tag) {
            var entry = null;
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].id === currentEditId) { entry = entries[i]; break; }
            }
            if (!entry) return;
            var newTags = [];
            for (var j = 0; j < entry.tags.length; j++) {
                if (entry.tags[j] !== tag) newTags.push(entry.tags[j]);
            }
            entry.tags = newTags;
            entry.updateTime = new Date().toISOString();
            saveLocalData();
            renderDetailTags(entry.tags);
            render();
            if (isCloudReady) syncToCloud(entries);
            showToast('已移除标签');
        }

        function closeDetail() {
            detailOverlay.classList.remove('open');
            currentEditId = null;
        }

        async function saveDetail() {
            var entry = null;
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].id === currentEditId) { entry = entries[i]; break; }
            }
            if (!entry) { showToast('记录不存在'); return; }

            var title = detailTitleInput.value.trim() || '未命名';
            var content = detailContentTextarea.value.trim();
            if (!content) { showToast('请输入内容'); return; }

            entry.title = title;
            entry.content = content;
            entry.updateTime = new Date().toISOString();

            var shouldRegenerate = entry.summary === '' || entry.summary === '点击「重新生成」或保存时自动生成';
            if (shouldRegenerate) {
                detailSummaryText.textContent = '⏳ 生成中...';
                detailSummaryText.className = 'summary-text loading';
                var result = await generateSummary(content, title);
                if (result.success) {
                    entry.summary = result.summary;
                    detailSummaryText.textContent = result.summary;
                    detailSummaryText.className = 'summary-text';
                } else {
                    detailSummaryText.textContent = '❌ ' + result.error;
                    detailSummaryText.className = 'summary-text error';
                }
            }

            saveLocalData();
            render();
            if (isCloudReady) syncToCloud(entries);
            detailTimestamp.textContent = formatTime(entry.updateTime);
            showToast('✅ 已保存');
        }

        async function deleteDetail() {
            if (!confirm('确定删除这条记录吗？')) return;

            var newEntries = [];
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].id !== currentEditId) newEntries.push(entries[i]);
            }
            entries = newEntries;

            saveLocalData();
            closeDetail();
            render();
            if (isCloudReady) syncToCloud(entries);
            showToast('✅ 已删除');
        }

        async function regenerateSummary() {
            var entry = null;
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].id === currentEditId) { entry = entries[i]; break; }
            }
            if (!entry) { showToast('记录不存在'); return; }

            var apiKey = getApiKey();
            if (!apiKey) { showToast('请先配置 API Key'); return; }

            if (isGeneratingSummary) return;
            isGeneratingSummary = true;
            regenerateSummaryBtn.disabled = true;

            detailSummaryText.textContent = '⏳ 生成中...';
            detailSummaryText.className = 'summary-text loading';

            var result = await generateSummary(entry.content, entry.title);

            if (result.success) {
                entry.summary = result.summary;
                detailSummaryText.textContent = result.summary;
                detailSummaryText.className = 'summary-text';
                saveLocalData();
                render();
                if (isCloudReady) syncToCloud(entries);
                showToast('✅ 总结已更新');
            } else {
                detailSummaryText.textContent = '❌ ' + result.error;
                detailSummaryText.className = 'summary-text error';
                showToast('❌ ' + result.error);
            }

            isGeneratingSummary = false;
            regenerateSummaryBtn.disabled = false;
        }

        // ============================================================
        //  新建记录
        // ============================================================
        function renderModalTags() {
            modalTagsSection.innerHTML = '';
            for (var i = 0; i < modalTags.length; i++) {
                var tag = modalTags[i];
                var span = document.createElement('span');
                span.className = 'tag-pill';
                span.innerHTML = escapeHtml(tag) +
                    ' <button class="remove-tag" data-tag="' + escapeHtml(tag) + '">✕</button>';
                modalTagsSection.appendChild(span);
            }

            var input = document.createElement('input');
            input.className = 'tag-input';
            input.placeholder = '添加标签';
            input.id = 'modalTagInput2';
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addModalTag();
                }
            });

            var addBtn = document.createElement('button');
            addBtn.className = 'add-tag-btn';
            addBtn.textContent = '＋ 添加';
            addBtn.addEventListener('click', addModalTag);

            modalTagsSection.appendChild(input);
            modalTagsSection.appendChild(addBtn);

            var removeBtns = document.querySelectorAll('#modalTagsSection .remove-tag');
            for (var j = 0; j < removeBtns.length; j++) {
                removeBtns[j].addEventListener('click', function() {
                    var tag = this.dataset.tag;
                    var newTags = [];
                    for (var k = 0; k < modalTags.length; k++) {
                        if (modalTags[k] !== tag) newTags.push(modalTags[k]);
                    }
                    modalTags = newTags;
                    renderModalTags();
                });
            }
        }

        function addModalTag() {
            var input = document.getElementById('modalTagInput2');
            if (!input) return;
            var tag = input.value.trim();
            if (!tag) return;
            if (tag.length > 20) { showToast('标签不能超过20个字符'); return; }
            for (var i = 0; i < modalTags.length; i++) {
                if (modalTags[i] === tag) { showToast('标签已存在'); return; }
            }
            modalTags.push(tag);
            input.value = '';
            renderModalTags();
        }

        function openModal() {
            modalTags = [];
            inputTitle.value = '';
            inputContent.value = '';
            renderModalTags();
            modalOverlay.classList.add('open');
            setTimeout(function() { inputTitle.focus(); }, 100);
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
        }

        async function saveNewEntry() {
            var title = inputTitle.value.trim() || '未命名';
            var content = inputContent.value.trim();
            if (!content) { showToast('请输入内容'); return; }

            var entry = {
                id: generateId(),
                title: title,
                content: content,
                tags: modalTags.slice(),
                summary: '',
                timestamp: new Date().toISOString(),
                updateTime: new Date().toISOString()
            };

            entries.push(entry);
            saveLocalData();
            render();
            closeModal();

            var result = await generateSummary(content, title);
            if (result.success) {
                entry.summary = result.summary;
                saveLocalData();
                render();
            }

            if (isCloudReady) {
                log('新建记录，触发同步...');
                await syncToCloud(entries);
            }
            openDetail(entry.id);
            showToast('✅ 已保存');
        }

        // ============================================================
        //  ★★★ 核心：手动同步（带详细日志） ★★★
        // ============================================================
        async function manualSync() {
            log('========== 开始手动同步 ==========');

            if (!isCloudReady) {
                log('云端未连接，尝试初始化...');
                showToast('云端未连接，尝试初始化...');
                await initCloud();
                if (!isCloudReady) {
                    log('❌ 云端连接失败');
                    showToast('❌ 云端连接失败');
                    return;
                }
            }

            log('当前本地数据: ' + entries.length + ' 条');
            log('本地数据详情:', JSON.stringify(entries, null, 2));

            showToast('🔄 正在同步...');
            var cloudData = await loadFromCloud();

            if (cloudData === null) {
                log('❌ 拉取云端数据失败');
                showToast('❌ 同步失败');
                return;
            }

            log('云端数据: ' + cloudData.length + ' 条');
            if (cloudData.length > 0) {
                log('云端数据详情:', JSON.stringify(cloudData, null, 2));
            }

            if (cloudData.length > 0) {
                // 合并：云端优先
                var merged = entries.slice();
                log('开始合并，本地初始 ' + merged.length + ' 条');

                for (var i = 0; i < cloudData.length; i++) {
                    var cloudEntry = cloudData[i];
                    var found = false;
                    for (var j = 0; j < merged.length; j++) {
                        if (merged[j].id === cloudEntry.id) {
                            found = true;
                            var cloudTime = new Date(cloudEntry.updateTime || 0).getTime();
                            var localTime = new Date(merged[j].updateTime || 0).getTime();
                            if (cloudTime > localTime) {
                                log('云端记录更新: ' + cloudEntry.id + ' (云端 ' + cloudTime + ' > 本地 ' +
                                    localTime + ')');
                                merged[j] = cloudEntry;
                            } else {
                                log('本地记录更新: ' + cloudEntry.id + ' (本地 ' + localTime + ' > 云端 ' +
                                    cloudTime + ')');
                            }
                            break;
                        }
                    }
                    if (!found) {
                        log('新记录从云端合并: ' + cloudEntry.id);
                        merged.push(cloudEntry);
                    }
                }
                entries = merged;
                log('合并完成，共 ' + entries.length + ' 条');
                saveLocalData();
                render();
                showToast('✅ 同步完成 (合并 ' + cloudData.length + ' 条云端记录)');
            } else {
                // 云端为空，推送本地数据
                log('云端为空，推送本地 ' + entries.length + ' 条数据到云端');
                var result = await syncToCloud(entries);
                if (result) {
                    showToast('✅ 同步完成 (上传 ' + entries.length + ' 条记录)');
                } else {
                    showToast('❌ 上传失败');
                }
            }

            log('========== 手动同步结束 ==========');
        }

        // ============================================================
        //  初始化
        // ============================================================
        async function init() {
            log('========== 应用初始化 ==========');

            var savedKey = getApiKey();
            if (savedKey) {
                apiKeyInput.value = savedKey;
                updateApiStatus(true);
                log('✅ 已加载 API Key');
            } else {
                updateApiStatus(false);
                log('⚠️ 未配置 API Key');
            }

            var hasLocal = loadLocalData();
            if (!hasLocal || entries.length === 0) {
                log('本地无数据，创建示例数据...');
                entries = [{
                    id: generateId(),
                    title: '关于自动压缩的新想法',
                    content: '我发现自动压缩的关键不是压缩本身，而是压缩后如何保持因果链的完整性。',
                    summary: '用户认为自动压缩的核心在于保持因果链的完整性，而非压缩本身。',
                    tags: ['AI', '架构'],
                    timestamp: new Date(Date.now() - 86400000 * 2).toISOString(),
                    updateTime: new Date(Date.now() - 86400000 * 2).toISOString()
                }, {
                    id: generateId(),
                    title: '产品架构的底层逻辑',
                    content: '用户需要的是确定性，而不是灵活性。确定性带来信任，灵活性带来困惑。',
                    summary: '用户强调产品应优先提供确定性，灵活性可能削弱用户信任。',
                    tags: ['产品', 'UX'],
                    timestamp: new Date(Date.now() - 86400000).toISOString(),
                    updateTime: new Date(Date.now() - 86400000).toISOString()
                }, {
                    id: generateId(),
                    title: '记忆与压缩的边界',
                    content: '摘要应该保留因果链，而不是孤立事件。压缩应当保留决策路径。',
                    summary: '用户认为摘要应保留因果链和决策路径，而非仅记录孤立事件。',
                    tags: ['AI', '记忆'],
                    timestamp: new Date(Date.now() - 3600000 * 5).toISOString(),
                    updateTime: new Date(Date.now() - 3600000 * 5).toISOString()
                }];
                saveLocalData();
                log('✅ 已创建 ' + entries.length + ' 条示例数据');
            }

            log('初始化云端...');
            await initCloud();

            if (isCloudReady) {
                log('尝试从云端拉取数据...');
                var cloudData = await loadFromCloud();
                if (cloudData !== null && cloudData.length > 0) {
                    log('云端有 ' + cloudData.length + ' 条数据，开始合并...');
                    var merged = entries.slice();
                    for (var i = 0; i < cloudData.length; i++) {
                        var cloudEntry = cloudData[i];
                        var found = false;
                        for (var j = 0; j < merged.length; j++) {
                            if (merged[j].id === cloudEntry.id) {
                                found = true;
                                var cloudTime = new Date(cloudEntry.updateTime || 0).getTime();
                                var localTime = new Date(merged[j].updateTime || 0).getTime();
                                if (cloudTime > localTime) {
                                    merged[j] = cloudEntry;
                                }
                                break;
                            }
                        }
                        if (!found) {
                            merged.push(cloudEntry);
                        }
                    }
                    entries = merged;
                    saveLocalData();
                    log('合并完成，共 ' + entries.length + ' 条');
                } else if (cloudData !== null && cloudData.length === 0 && entries.length > 0) {
                    log('云端为空，推送本地数据...');
                    await syncToCloud(entries);
                }
            } else {
                log('⚠️ 云端未就绪，仅使用本地数据');
            }

            render();
            log('========== 初始化完成 ==========');
            console.log('✅ 灵感备忘录初始化完成（调试版）');
            console.log('📊 当前记录数: ' + entries.length);
            console.log('☁️ 云端状态: ' + (isCloudReady ? '已连接' : '未连接'));
        }

        // ============================================================
        //  事件绑定
        // ============================================================
        saveKeyBtn.addEventListener('click', function() {
            var key = apiKeyInput.value.trim();
            if (!key) { showToast('请输入 API Key'); return; }
            if (!key.startsWith('sk-')) { showToast('格式错误，应以 sk- 开头'); return; }
            setApiKey(key);
            updateApiStatus(true);
            showToast('✅ API Key 已保存');
            log('API Key 已保存');
        });

        syncBtn.addEventListener('click', manualSync);

        newEntryBtn.addEventListener('click', openModal);
        cancelModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        saveEntryBtn.addEventListener('click', saveNewEntry);

        inputContent.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                saveNewEntry();
            }
        });

        closeDetailBtn.addEventListener('click', closeDetail);
        detailOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeDetail();
        });
        saveDetailBtn.addEventListener('click', saveDetail);
        deleteDetailBtn.addEventListener('click', deleteDetail);
        regenerateSummaryBtn.addEventListener('click', regenerateSummary);

        document.addEventListener('keydown', function(e) {
            if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
                if (detailOverlay.classList.contains('open')) {
                    e.preventDefault();
                    saveDetail();
                }
            }
            if (e.key === 'Escape') {
                if (detailOverlay.classList.contains('open')) closeDetail();
                if (modalOverlay.classList.contains('open')) closeModal();
            }
        });

        modalAddTagBtn.addEventListener('click', function() {
            var tag = modalTagInput.value.trim();
            if (!tag) return;
            if (tag.length > 20) { showToast('标签不能超过20个字符'); return; }
            for (var i = 0; i < modalTags.length; i++) {
                if (modalTags[i] === tag) { showToast('标签已存在'); return; }
            }
            modalTags.push(tag);
            modalTagInput.value = '';
            renderModalTags();
        });

        // 启动
        init();

        // ============================================================
        //  暴露全局（调试用）
        // ============================================================
        window.entries = entries;
        window.render = render;
        window.syncToCloud = syncToCloud;
        window.generateSummary = generateSummary;
        window.manualSync = manualSync;
        window.log = log;

        console.log('💡 调试提示: 在控制台输入 manualSync() 可手动触发同步');
    </script>
</body>
</html>
