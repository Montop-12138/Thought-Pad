<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>故事织机 · 自由对话版</title>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #e8ddd0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
      font-family: 'Georgia', 'Times New Roman', serif;
      background-image: 
        radial-gradient(ellipse at 20% 30%, rgba(200, 180, 160, 0.2) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(180, 160, 140, 0.15) 0%, transparent 50%),
        repeating-linear-gradient(45deg, rgba(180, 160, 140, 0.02) 0px, rgba(180, 160, 140, 0.02) 2px, transparent 2px, transparent 6px);
    }
    .story-loom {
      max-width: 820px;
      width: 100%;
      background: #faf6f0;
      background-image: 
        linear-gradient(0deg, rgba(215, 195, 175, 0.1) 0%, transparent 20%, transparent 80%, rgba(215, 195, 175, 0.1) 100%),
        repeating-linear-gradient(45deg, rgba(180, 160, 140, 0.03) 0px, rgba(180, 160, 140, 0.03) 2px, transparent 2px, transparent 6px);
      box-shadow: 0 12px 30px rgba(60, 40, 20, 0.2), inset 0 1px 4px rgba(255, 245, 235, 0.8);
      border-radius: 6px 6px 20px 20px;
      padding: 2rem 1.8rem 2.5rem;
      position: relative;
      transition: all 0.2s ease;
      border: 1px solid #d9c8b2;
    }
    .story-loom::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 20px;
      right: 20px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(180, 150, 120, 0.15), transparent);
      opacity: 0.4;
    }
    .status-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #5a4a3a; border-bottom: 1px dashed #d9c8b2; padding-bottom: 0.6rem; margin-bottom: 1.8rem; letter-spacing: 0.03em; gap: 0.5rem; }
    .status-item { display: flex; align-items: center; gap: 0.4rem; background: rgba(220, 200, 180, 0.2); padding: 0.2rem 0.8rem; border-radius: 30px; border: 1px solid #e6d7c6; backdrop-filter: blur(2px); }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #b0a090; }
    .status-dot.on { background: #5f7a5f; box-shadow: 0 0 6px #9bbf9b; }
    .status-dot.loading { background: #f0c040; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .api-config { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .api-config input { background: #fefcf8; border: 1px solid #d9c8b2; border-radius: 40px; padding: 0.25rem 0.8rem; font-size: 0.75rem; font-family: inherit; width: 140px; color: #3a2c1b; outline: none; transition: 0.2s; }
    .api-config input:focus { border-color: #b8a088; box-shadow: 0 0 0 2px rgba(180, 150, 120, 0.2); }
    .api-config button { background: transparent; border: 1px solid #d9c8b2; border-radius: 40px; padding: 0.15rem 0.8rem; font-size: 0.7rem; cursor: pointer; color: #3a2c1b; transition: 0.2s; font-family: inherit; }
    .api-config button:hover { background: #e6d7c6; }
    .user-id-area { margin-bottom: 1rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; background: rgba(220, 200, 180, 0.2); padding: 0.5rem 1rem; border-radius: 12px; border: 1px solid #d9c8b2; }
    .user-id-area label { font-size: 0.85rem; color: #4a3a2a; }
    .user-id-area input { flex: 1; background: #fefcf8; border: 1px solid #d9c8b2; border-radius: 40px; padding: 0.3rem 1rem; font-family: inherit; font-size: 0.85rem; outline: none; min-width: 120px; }
    .user-id-area input:focus { border-color: #b8a088; }
    .inspiration-area { margin-bottom: 2.2rem; }
    .inspiration-area textarea { width: 100%; background: #fefcf8; border: 1px solid #d9c8b2; border-radius: 12px; padding: 1.2rem 1.4rem; font-family: 'Georgia', serif; font-size: 1rem; color: #3a2c1b; resize: vertical; min-height: 80px; line-height: 1.6; box-shadow: inset 0 2px 6px rgba(100, 70, 40, 0.06); transition: 0.2s; outline: none; }
    .inspiration-area textarea:focus { border-color: #b8a088; box-shadow: inset 0 2px 8px rgba(100, 70, 40, 0.08), 0 0 0 3px rgba(200, 175, 150, 0.15); }
    .inspiration-area textarea::placeholder { color: #b8a898; font-style: italic; }
    .btn-group { display: flex; justify-content: flex-end; margin-top: 0.8rem; gap: 0.8rem; flex-wrap: wrap; }
    .btn { background: #f5efe6; border: 1px solid #d9c8b2; padding: 0.5rem 1.8rem; border-radius: 60px; font-family: 'Georgia', serif; font-size: 0.9rem; color: #3a2c1b; cursor: pointer; box-shadow: 0 2px 4px rgba(100, 70, 40, 0.08); transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 0.4rem; letter-spacing: 0.04em; }
    .btn-primary { background: #e6d7c6; border-color: #c0ab94; box-shadow: 0 2px 6px rgba(130, 100, 70, 0.15); }
    .btn-primary:hover { background: #dccbb8; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(130, 100, 70, 0.2); }
    .btn:active { transform: translateY(1px); box-shadow: none; }
    .btn-icon { font-size: 1.2rem; line-height: 1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .btn-small { padding: 0.25rem 1.2rem; font-size: 0.75rem; background: #faf6f0; border: 1px solid #d9c8b2; border-radius: 40px; cursor: pointer; color: #3a2c1b; transition: 0.15s; font-family: inherit; }
    .btn-small:hover { background: #e6d7c6; }
    .dialogue-area {
      background: rgba(255, 248, 240, 0.6);
      border-radius: 20px 20px 12px 12px;
      padding: 1.4rem 0.8rem 0.2rem 0.8rem;
      margin: 1.8rem 0 1.2rem;
      border: 1px solid #e6d7c6;
      max-height: 420px;
      overflow-y: auto;
      scroll-behavior: smooth;
      box-shadow: inset 0 2px 10px rgba(140, 110, 80, 0.05);
    }
    .dialogue-area::-webkit-scrollbar { width: 5px; }
    .dialogue-area::-webkit-scrollbar-track { background: #ede5db; border-radius: 20px; }
    .dialogue-area::-webkit-scrollbar-thumb { background: #d9c8b2; border-radius: 20px; }
    .message { display: flex; margin-bottom: 1.2rem; animation: fadeSlide 0.4s ease; position: relative; }
    .message-ai { justify-content: flex-start; }
    .message-user { justify-content: flex-end; }
    .message-thinking { justify-content: flex-start; opacity: 0.7; }
    .bubble {
      max-width: 80%;
      padding: 0.8rem 1.2rem;
      border-radius: 24px 24px 6px 24px;
      background: #f5efe6;
      border: 1px solid #e6d7c6;
      color: #3a2c1b;
      font-size: 0.95rem;
      line-height: 1.6;
      box-shadow: 0 2px 4px rgba(100, 70, 40, 0.06);
      position: relative;
      word-break: break-word;
    }
    .message-user .bubble { background: #e6d7c6; border-color: #d0bca8; border-radius: 24px 24px 24px 6px; }
    .message-thinking .bubble { background: #f0ece6; border-color: #ddd0c4; font-style: italic; color: #7a6a5a; }
    .bubble small { display: block; font-size: 0.65rem; opacity: 0.7; margin-top: 0.4rem; text-align: right; font-style: italic; }
    .msg-label { font-size: 0.7rem; font-weight: bold; letter-spacing: 0.04em; color: #7a6a5a; margin-bottom: 0.2rem; }
    .message-user .bubble .edit-btn {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      color: #b8a898;
      cursor: pointer;
      font-size: 0.7rem;
      opacity: 0;
      transition: opacity 0.2s;
      font-family: inherit;
      padding: 0 4px;
    }
    .message-user:hover .bubble .edit-btn { opacity: 0.8; }
    .message-user .bubble .edit-btn:hover { color: #5a4a3a; opacity: 1; }
    .message-user .bubble .edit-area {
      width: 100%;
      background: #fefcf8;
      border: 1px solid #b8a088;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      color: #3a2c1b;
      resize: vertical;
      line-height: 1.6;
      outline: none;
      margin-bottom: 0.4rem;
      min-height: 60px;
    }
    .message-user .bubble .edit-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.2rem;
    }
    .message-user .bubble .edit-actions button {
      background: #f5efe6;
      border: 1px solid #d9c8b2;
      border-radius: 30px;
      padding: 0.1rem 0.8rem;
      font-size: 0.7rem;
      cursor: pointer;
      font-family: inherit;
      color: #3a2c1b;
      transition: 0.15s;
    }
    .message-user .bubble .edit-actions button:hover { background: #e6d7c6; }
    .message-user .bubble .edit-actions .save-edit-btn { background: #dccbb8; border-color: #c0ab94; }
    .message-user .bubble .edit-actions .save-edit-btn:hover { background: #d0bca8; }

    .framework-area { background: #f5efe6; border-radius: 20px; padding: 1.2rem 1.4rem; margin: 1.8rem 0 1.2rem; border: 1px solid #d9c8b2; box-shadow: inset 0 1px 8px rgba(160, 130, 100, 0.08); }
    .framework-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .framework-title h4 { font-weight: normal; letter-spacing: 0.06em; color: #4a3a2a; font-size: 1rem; }
    .progress-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1.2rem; }
    .progress-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: #4a3a2a; }
    .progress-track { flex: 1; height: 6px; background: #e6d7c6; border-radius: 20px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #b8a088; border-radius: 20px; transition: width 0.6s ease; }
    .framework-draft { margin-top: 0.8rem; background: #fefcf8; padding: 0.8rem 1rem; border-radius: 12px; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; max-height: 180px; overflow-y: auto; border: 1px dashed #d9c8b2; color: #3a2c1b; }
    .export-group { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 0.6rem; flex-wrap: wrap; }
    @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) {
      .story-loom { padding: 1.2rem 1rem; }
      .status-bar { flex-direction: column; align-items: stretch; gap: 0.5rem; }
      .api-config { flex-wrap: wrap; }
      .api-config input { width: 100%; }
      .progress-grid { grid-template-columns: 1fr; }
      .bubble { max-width: 92%; }
      .user-id-area { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
<div class="story-loom" id="app">
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot" id="apiDot"></span>
      <span id="apiStatusText">未配置密钥</span>
    </div>
    <div class="status-item">
      <span class="status-dot" id="cloudDot" style="background:#b0a090;"></span>
      <span id="cloudStatusText">云端未连接</span>
    </div>
    <div class="api-config">
      <input type="text" id="apiKeyInput" placeholder="DeepSeek API Key" value="">
      <button id="saveApiBtn">保存</button>
    </div>
  </div>

  <div class="user-id-area">
    <label>👤 用户ID：</label>
    <input type="text" id="userIdInput" placeholder="输入用户ID（多端同步识别）">
    <button id="syncBtn" class="btn-small" style="background:#e6d7c6;">🔄 同步</button>
    <button id="cloudSaveBtn" class="btn-small" style="background:#dccbb8;">☁️ 保存到云端</button>
  </div>

  <div class="inspiration-area">
    <textarea id="inspirationInput" placeholder="把您脑海里一闪而过的念头写在这里… 例如：一个在图书馆里发现会自己写字的笔的人。"></textarea>
    <div class="btn-group">
      <button class="btn btn-primary" id="startBtn"><span class="btn-icon">✉</span> 开始对话</button>
      <button class="btn" id="clearBtn"><span class="btn-icon">⌫</span> 重置</button>
    </div>
  </div>

  <div class="dialogue-area" id="dialogueBox"></div>

  <div class="framework-area" id="frameworkArea">
    <div class="framework-title">
      <h4>📜 故事框架草稿</h4>
      <span style="font-size:0.7rem; color:#7a6a5a;">进度</span>
    </div>
    <div class="progress-grid" id="progressGrid">
      <div class="progress-item"><span>世界观</span><div class="progress-track"><div class="progress-fill" id="progWorld" style="width:0%"></div></div></div>
      <div class="progress-item"><span>人物</span><div class="progress-track"><div class="progress-fill" id="progChar" style="width:0%"></div></div></div>
      <div class="progress-item"><span>冲突</span><div class="progress-track"><div class="progress-fill" id="progConflict" style="width:0%"></div></div></div>
      <div class="progress-item"><span>结构</span><div class="progress-track"><div class="progress-fill" id="progStruct" style="width:0%"></div></div></div>
    </div>
    <div class="framework-draft" id="frameworkDraft">✨ 写下你的灵感，开始一段创作对话。</div>
    <div class="export-group">
      <button class="btn-small" id="exportMd">📄 导出 Markdown</button>
      <button class="btn-small" id="exportTxt">📃 导出 TXT</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ========== 配置 ==========
    const CLOUD_ENV_ID = 'deepseek-chat-d5gg0748z3b9dfe24';
    const CLOUD_COLLECTION = 'story_weaver_entries';
    
    // ========== 云开发 ==========
    let db, collection;
    let cloudInitialized = false;
    try {
      if (typeof cloudbase !== 'undefined') {
        const app = cloudbase.init({ env: CLOUD_ENV_ID });
        db = app.database();
        collection = db.collection(CLOUD_COLLECTION);
        cloudInitialized = true;
        console.log('✅ 腾讯云初始化成功');
        document.getElementById('cloudStatusText').textContent = '☁️ 云端已就绪';
        document.getElementById('cloudDot').style.background = '#5f7a5f';
      }
    } catch (err) { console.error('❌ 腾讯云初始化失败:', err); }

    // ========== 状态 ==========
    let state = {
      apiKey: localStorage.getItem('storyLoom_apiKey') || '',
      userId: localStorage.getItem('storyLoom_userId') || '',
      inspiration: localStorage.getItem('storyLoom_inspiration') || '',
      messages: JSON.parse(localStorage.getItem('storyLoom_messages') || '[]'),
      cloudDocId: localStorage.getItem('storyLoom_cloudDocId') || null,
      lastSyncTime: localStorage.getItem('storyLoom_lastSyncTime') || null,
      isProcessing: false,
      editingIndex: -1,
      conversationStarted: localStorage.getItem('storyLoom_conversationStarted') === 'true' || false
    };

    // ========== DOM ==========
    const apiInput = document.getElementById('apiKeyInput');
    const userIdInput = document.getElementById('userIdInput');
    const apiDot = document.getElementById('apiDot');
    const apiStatusText = document.getElementById('apiStatusText');
    const cloudDot = document.getElementById('cloudDot');
    const cloudStatusText = document.getElementById('cloudStatusText');
    const inspirationInput = document.getElementById('inspirationInput');
    const startBtn = document.getElementById('startBtn');
    const clearBtn = document.getElementById('clearBtn');
    const syncBtn = document.getElementById('syncBtn');
    const cloudSaveBtn = document.getElementById('cloudSaveBtn');
    const dialogueBox = document.getElementById('dialogueBox');
    const frameworkDraft = document.getElementById('frameworkDraft');
    const progWorld = document.getElementById('progWorld');
    const progChar = document.getElementById('progChar');
    const progConflict = document.getElementById('progConflict');
    const progStruct = document.getElementById('progStruct');

    // ========== 辅助 ==========
    function saveState() {
      localStorage.setItem('storyLoom_apiKey', state.apiKey);
      localStorage.setItem('storyLoom_userId', state.userId);
      localStorage.setItem('storyLoom_inspiration', state.inspiration);
      localStorage.setItem('storyLoom_messages', JSON.stringify(state.messages));
      localStorage.setItem('storyLoom_conversationStarted', String(state.conversationStarted));
      if (state.cloudDocId) localStorage.setItem('storyLoom_cloudDocId', state.cloudDocId);
      if (state.lastSyncTime) localStorage.setItem('storyLoom_lastSyncTime', state.lastSyncTime);
    }

    function updateProgress() {
      // 简化的进度显示：基于对话轮数
      const userMsgs = state.messages.filter(m => m.role === 'user').length;
      const total = Math.min(userMsgs, 20);
      const pct = Math.min(100, (total / 20) * 100);
      const setWidth = (el, val) => { if (el) el.style.width = Math.min(100, val) + '%'; };
      setWidth(progWorld, pct);
      setWidth(progChar, pct);
      setWidth(progConflict, pct);
      setWidth(progStruct, pct);
    }

    function updateDraft() {
      // 从对话中提取关键信息显示在框架中
      const msgs = state.messages.filter(m => m.role === 'user');
      let parts = [];
      if (state.inspiration) parts.push(`【灵感】${state.inspiration}`);
      
      // 取最近的几条用户消息作为摘要
      const recent = msgs.slice(-3);
      if (recent.length > 0) {
        parts.push('【最近的思考】');
        recent.forEach((m, i) => {
          const preview = m.content.length > 50 ? m.content.slice(0, 50) + '…' : m.content;
          parts.push(`  ${i+1}. ${preview}`);
        });
      }
      
      frameworkDraft.textContent = parts.length ? parts.join('\n') : '✨ 写下你的灵感，开始一段创作对话。';
      updateProgress();
    }

    // ========== 渲染消息 ==========
    function renderMessages() {
      dialogueBox.innerHTML = '';
      state.messages.forEach((msg, index) => {
        const div = document.createElement('div');
        let cls = `message ${msg.role === 'user' ? 'message-user' : 'message-ai'}`;
        if (msg.role === 'thinking') cls = 'message-thinking';
        div.className = cls;
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        const label = document.createElement('div');
        label.className = 'msg-label';
        if (msg.role === 'user') label.textContent = '✍️ 你';
        else if (msg.role === 'thinking') label.textContent = '⏳ 思考中...';
        else label.textContent = '📜 引导者';
        bubble.appendChild(label);

        if (msg.role === 'user' && state.editingIndex === index) {
          const textarea = document.createElement('textarea');
          textarea.className = 'edit-area';
          textarea.value = msg.content;
          textarea.rows = 3;
          bubble.appendChild(textarea);

          const actions = document.createElement('div');
          actions.className = 'edit-actions';
          
          const saveBtn = document.createElement('button');
          saveBtn.className = 'save-edit-btn';
          saveBtn.textContent = '✓ 保存并重新引导';
          
          const cancelBtn = document.createElement('button');
          cancelBtn.textContent = '取消';
          
          actions.appendChild(saveBtn);
          actions.appendChild(cancelBtn);
          bubble.appendChild(actions);

          saveBtn.addEventListener('click', async () => {
            const newContent = textarea.value.trim();
            if (!newContent) { alert('内容不能为空'); return; }
            state.messages[index].content = newContent;
            state.editingIndex = -1;
            saveState();
            renderMessages();
            updateDraft();
            // 重新生成后续对话
            await regenerateFromIndex(index);
            autoSyncToCloud();
          });
          
          cancelBtn.addEventListener('click', () => {
            state.editingIndex = -1;
            renderMessages();
          });
          
          setTimeout(() => textarea.focus(), 50);
        } else {
          const contentDiv = document.createElement('div');
          contentDiv.textContent = msg.content;
          bubble.appendChild(contentDiv);

          if (msg.role === 'user') {
            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.textContent = '✎';
            editBtn.title = '编辑此消息';
            editBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              if (state.isProcessing) { alert('请等待当前处理完成'); return; }
              state.editingIndex = index;
              renderMessages();
            });
            bubble.appendChild(editBtn);
          }
        }

        const time = document.createElement('small');
        time.textContent = new Date(msg.time || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        bubble.appendChild(time);
        
        div.appendChild(bubble);
        dialogueBox.appendChild(div);
      });
      dialogueBox.scrollTop = dialogueBox.scrollHeight;
    }

    // ========== 添加消息 ==========
    function addMessage(role, content, save = true) {
      state.messages.push({ role, content, time: Date.now() });
      if (save) saveState();
      renderMessages();
      updateDraft();
      if (cloudInitialized && state.userId && save) autoSyncToCloud();
    }

    // ========== AI 引导（自由对话版） ==========
    async function getAIGuidance(userAnswer) {
      const apiKey = state.apiKey;
      if (!apiKey) throw new Error('请先配置 DeepSeek API Key');

      // 构建完整的对话历史
      const conversationHistory = state.messages.map(m => ({
        role: m.role === 'user' ? 'user' : 'assistant',
        content: m.content
      }));

      // 系统提示词 - 定义引导者的角色和风格
      const systemPrompt = `你是一位温暖、富有洞察力的故事创作导师。你的任务是引导用户构建故事，而不是替用户写故事。

你的核心原则：
1. **不设限**：没有固定的问题数量，根据用户的回答自然延伸对话
2. **累积观察**：记住用户之前说过的所有内容，在提问中引用和关联
3. **灵活追问**：
   - 觉得不够深入 → 追问细节（"能再多说一点关于……吗？"）
   - 觉得有矛盾或模糊 → 指出并探讨（"你之前说……，现在又说……，这两者之间有什么关系吗？"）
   - 觉得有新方向 → 引导探索（"如果……会怎样？"）
   - 觉得用户有情绪或投入 → 共情并深化（"听起来你对……很有感觉，能再描述一下那个画面吗？"）
4. **简短而自然**：每次回复不超过2-3句话，像朋友聊天一样

你的风格：
- 温暖、鼓励、富有诗意
- 像一位坐在壁炉边的老朋友
- 提出的问题帮助用户自我发现
- 每次只提1-2个问题

当前对话主题：${state.inspiration || '一个故事灵感'}

请基于用户的最新回答，结合整个对话历史，提出下一个引导问题。`;

      try {
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: systemPrompt },
              ...conversationHistory.slice(-10) // 只发送最近10条，避免token过多
            ],
            temperature: 0.85,
            max_tokens: 300,
            stream: false
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error?.message || `API 请求失败 (${response.status})`);
        }
        const data = await response.json();
        return data.choices[0].message.content.trim();
      } catch (err) {
        console.error('AI 调用失败:', err);
        throw err;
      }
    }

    // ========== 处理用户回答 ==========
    async function processUserAnswer(answer) {
      if (!answer.trim() || state.isProcessing) return;
      
      addMessage('user', answer);
      addMessage('thinking', '正在思考你的回答…', false);
      state.isProcessing = true;
      
      try {
        const aiResponse = await getAIGuidance(answer);
        state.messages = state.messages.filter(m => m.role !== 'thinking');
        renderMessages();
        addMessage('ai', aiResponse);
      } catch (err) {
        state.messages = state.messages.filter(m => m.role !== 'thinking');
        renderMessages();
        console.error('处理回答失败:', err);
        const fallback = '嗯，我感受到你正在深入这个故事。能再多说一点吗？比如，当时的场景是什么样的？';
        addMessage('ai', `⚠️ 我遇到了一点小问题。不过没关系，让我们继续：${fallback}`);
      } finally {
        state.isProcessing = false;
      }
    }

    // ========== 重新生成后续对话 ==========
    async function regenerateFromIndex(startIndex) {
      const previousMessages = state.messages.slice(0, startIndex + 1);
      state.messages = previousMessages;
      saveState();
      renderMessages();
      updateDraft();
      
      // 检查是否还有后续用户消息需要重新处理
      // 这里简单处理：如果有最后一条用户消息，重新生成AI响应
      const lastUserMsg = previousMessages.filter(m => m.role === 'user').pop();
      if (lastUserMsg) {
        addMessage('thinking', '正在重新思考引导方向…', false);
        state.isProcessing = true;
        try {
          const aiResponse = await getAIGuidance(lastUserMsg.content);
          state.messages = state.messages.filter(m => m.role !== 'thinking');
          renderMessages();
          addMessage('ai', aiResponse);
        } catch (err) {
          state.messages = state.messages.filter(m => m.role !== 'thinking');
          renderMessages();
          console.error('重新生成失败:', err);
        } finally {
          state.isProcessing = false;
        }
      }
    }

    // ========== 业务逻辑 ==========
    function resetAll() {
      if (confirm('重置所有对话与进度？')) {
        state.messages = [];
        state.inspiration = '';
        state.conversationStarted = false;
        inspirationInput.value = '';
        state.isProcessing = false;
        state.editingIndex = -1;
        saveState();
        updateUI();
        addMessage('ai', '📖 已重置。写下新的灵感，让我们重新开始一段创作对话。');
      }
    }

    function startConversation() {
      const raw = inspirationInput.value.trim();
      if (!raw) { alert('请先写下一个灵感片段。'); return; }
      if (!state.apiKey) { alert('请先配置 DeepSeek API Key（页面顶部输入框）'); return; }
      if (!state.userId) { alert('请先设置用户ID（用于多端同步）'); return; }

      state.inspiration = raw;
      state.messages = [];
      state.conversationStarted = true;
      saveState();
      
      addMessage('user', `灵感：${raw}`);
      
      addMessage('thinking', '正在构思第一个引导问题…', false);
      state.isProcessing = true;
      
      getAIGuidance(raw)
        .then(question => {
          state.messages = state.messages.filter(m => m.role !== 'thinking');
          renderMessages();
          addMessage('ai', question);
          state.isProcessing = false;
        })
        .catch(err => {
          state.messages = state.messages.filter(m => m.role !== 'thinking');
          renderMessages();
          console.error('生成引导问题失败:', err);
          addMessage('ai', `📜 这个灵感很有潜力。让我们从第一个问题开始：当你想到这个画面时，最先浮现的情绪是什么？`);
          state.isProcessing = false;
        });
      
      inspirationInput.value = '';
      updateUI();
    }

    function updateUI() {
      inspirationInput.value = state.inspiration;
      renderMessages();
      updateDraft();
    }

    // ========== 云端同步 ==========
    async function loadFromCloud() {
      if (!cloudInitialized || !state.userId) return;
      try {
        cloudStatusText.textContent = '正在加载...';
        cloudDot.style.background = '#f0c040';
        const res = await collection.where({ userId: state.userId }).get();
        if (res.data && res.data.length > 0) {
          const doc = res.data[0];
          state.cloudDocId = doc._id;
          if (doc.inspiration) state.inspiration = doc.inspiration;
          if (doc.messages) state.messages = doc.messages;
          if (doc.lastSyncTime) state.lastSyncTime = doc.lastSyncTime;
          if (doc.conversationStarted !== undefined) state.conversationStarted = doc.conversationStarted;
          saveState();
          updateUI();
          cloudStatusText.textContent = `✅ 已同步 (${new Date(doc.updatedAt || Date.now()).toLocaleString()})`;
          cloudDot.style.background = '#5f7a5f';
        }
      } catch (err) {
        console.error('加载失败:', err);
        cloudStatusText.textContent = '❌ 加载失败';
        cloudDot.style.background = '#c04040';
      }
    }

    async function saveToCloud() {
      if (!cloudInitialized || !state.userId) return;
      try {
        cloudStatusText.textContent = '正在保存...';
        cloudDot.style.background = '#f0c040';
        const data = {
          userId: state.userId,
          inspiration: state.inspiration,
          messages: state.messages,
          lastSyncTime: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          conversationStarted: state.conversationStarted
        };
        if (state.cloudDocId) {
          await collection.doc(state.cloudDocId).update(data);
        } else {
          const result = await collection.add(data);
          state.cloudDocId = result.id;
          localStorage.setItem('storyLoom_cloudDocId', state.cloudDocId);
        }
        state.lastSyncTime = data.lastSyncTime;
        saveState();
        cloudStatusText.textContent = `✅ 已保存 (${new Date().toLocaleString()})`;
        cloudDot.style.background = '#5f7a5f';
      } catch (err) {
        console.error('保存失败:', err);
        cloudStatusText.textContent = '❌ 保存失败';
        cloudDot.style.background = '#c04040';
      }
    }

    let syncTimeout = null;
    function autoSyncToCloud() { clearTimeout(syncTimeout); syncTimeout = setTimeout(saveToCloud, 3000); }

    // ========== 导出 ==========
    function exportContent(format) {
      let content = '# 故事织机 · 对话记录\n\n';
      content += `## 灵感\n${state.inspiration || '（未记录）'}\n\n`;
      content += `## 用户ID\n${state.userId || '（未设置）'}\n\n`;
      content += `## 对话\n`;
      state.messages.forEach(m => {
        if (m.role === 'thinking') return;
        const role = m.role === 'user' ? '你' : '引导者';
        content += `**${role}**：${m.content}\n\n`;
      });

      const blob = new Blob([content], { type: format === 'md' ? 'text/markdown' : 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `故事对话_${state.userId || 'default'}.${format === 'md' ? 'md' : 'txt'}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ========== 初始化 ==========
    function initUI() {
      apiInput.value = state.apiKey;
      userIdInput.value = state.userId;
      inspirationInput.value = state.inspiration;
      if (state.apiKey) {
        apiDot.className = 'status-dot on';
        apiStatusText.textContent = '已配置密钥';
      }
      renderMessages();
      updateDraft();
      if (state.userId && cloudInitialized) setTimeout(loadFromCloud, 500);
    }

    // ========== 事件绑定 ==========
    document.getElementById('saveApiBtn').addEventListener('click', function() {
      state.apiKey = apiInput.value.trim();
      saveState();
      apiDot.className = state.apiKey ? 'status-dot on' : 'status-dot';
      apiStatusText.textContent = state.apiKey ? '已配置密钥' : '未配置密钥';
    });

    userIdInput.addEventListener('change', function() {
      state.userId = this.value.trim();
      saveState();
      if (state.userId && cloudInitialized) setTimeout(loadFromCloud, 300);
    });

    syncBtn.addEventListener('click', loadFromCloud);
    cloudSaveBtn.addEventListener('click', saveToCloud);
    startBtn.addEventListener('click', startConversation);
    clearBtn.addEventListener('click', resetAll);
    document.getElementById('exportMd').addEventListener('click', () => exportContent('md'));
    document.getElementById('exportTxt').addEventListener('click', () => exportContent('txt'));

    // ========== 输入框 ==========
    const inputArea = document.createElement('div');
    inputArea.style.display = 'flex';
    inputArea.style.marginTop = '0.8rem';
    inputArea.style.gap = '0.4rem';
    const answerInput = document.createElement('textarea');
    answerInput.placeholder = '回答引导者的问题… (Shift+Enter 换行)';
    answerInput.style.flex = '1';
    answerInput.style.background = '#fefcf8';
    answerInput.style.border = '1px solid #d9c8b2';
    answerInput.style.borderRadius = '12px';
    answerInput.style.padding = '0.6rem 1.2rem';
    answerInput.style.fontFamily = 'inherit';
    answerInput.style.fontSize = '0.9rem';
    answerInput.style.outline = 'none';
    answerInput.style.resize = 'vertical';
    answerInput.style.minHeight = '44px';
    answerInput.style.maxHeight = '150px';
    answerInput.style.lineHeight = '1.6';
    const sendBtn = document.createElement('button');
    sendBtn.textContent = '✉ 发送';
    sendBtn.className = 'btn-small';
    sendBtn.style.padding = '0.4rem 1.2rem';
    sendBtn.style.alignSelf = 'flex-end';
    inputArea.appendChild(answerInput);
    inputArea.appendChild(sendBtn);
    dialogueBox.parentNode.insertBefore(inputArea, dialogueBox.nextSibling);

    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleAnswer();
      }
    });

    function handleAnswer() {
      const val = answerInput.value.trim();
      if (!val || state.isProcessing) return;
      if (!state.conversationStarted) {
        alert('请先点击 "开始对话" 开启一段创作对话。');
        return;
      }
      processUserAnswer(val);
      answerInput.value = '';
      answerInput.style.height = '44px';
    }

    sendBtn.addEventListener('click', handleAnswer);

    answerInput.addEventListener('input', function() {
      this.style.height = '44px';
      this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });

    // 启动
    initUI();
    if (state.messages.length === 0 && !state.conversationStarted) {
      addMessage('ai', '📖 欢迎来到故事织机。写下你的灵感，我将引导你展开一段自由的创作对话。');
    }
  })();
</script>
</body>
</html>
