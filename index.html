<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新芽 · 灵感备忘录</title>
  <style>
    /* ===== 全局重置 & 绿色主题 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #eaf6ed;
      background-image: radial-gradient(circle at 10% 20%, rgba(120, 200, 150, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(80, 180, 120, 0.06) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ===== 主卡片 ===== */
    .app {
      max-width: 1200px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 36px;
      border: 1px solid rgba(100, 190, 140, 0.25);
      box-shadow: 0 20px 60px rgba(60, 140, 100, 0.08), 0 8px 24px rgba(60, 140, 100, 0.04);
      overflow: hidden;
      transition: all 0.2s;
    }

    /* ===== 头部 ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      border-bottom: 1px solid rgba(100, 190, 140, 0.15);
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #1f4a33;
    }

    .header h1 .icon-leaf {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      background: linear-gradient(145deg, #5cb885, #3da06a);
      border-radius: 10px;
      color: white;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(60, 180, 110, 0.25);
    }

    .header h1 span {
      background: rgba(60, 180, 110, 0.12);
      font-size: 13px;
      font-weight: 400;
      color: #2a6b47;
      padding: 2px 14px;
      border-radius: 40px;
      margin-left: 6px;
      border: 1px solid rgba(60, 180, 110, 0.08);
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: transparent;
      border: none;
      padding: 9px 20px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(145deg, #4caf7a, #3a9a65);
      color: white;
      box-shadow: 0 4px 14px rgba(60, 180, 110, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(60, 180, 110, 0.3);
    }
    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-outline {
      background: rgba(60, 180, 110, 0.06);
      border: 1px solid rgba(60, 180, 110, 0.15);
      color: #2a6b47;
    }
    .btn-outline:hover {
      background: rgba(60, 180, 110, 0.12);
    }

    /* ===== 主体 ===== */
    .main {
      display: flex;
      flex-direction: row;
      min-height: 480px;
      background: transparent;
    }

    /* ===== 时间轴 (左侧) ===== */
    .timeline {
      width: 200px;
      background: rgba(240, 250, 243, 0.5);
      border-right: 1px solid rgba(100, 190, 140, 0.12);
      padding: 24px 14px;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 580px;
    }

    .timeline-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #5a8f72;
      font-weight: 600;
      margin-bottom: 20px;
      padding-left: 6px;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
      padding: 4px 10px 4px 4px;
      border-radius: 14px;
      transition: 0.1s;
      cursor: default;
      position: relative;
    }

    .timeline-item.active {
      background: rgba(60, 180, 110, 0.08);
    }

    .timeline-dot {
      width: 12px;
      height: 12px;
      background: #b8d9c8;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
      border: 2px solid white;
      box-shadow: 0 0 0 1px #b8d9c8;
      transition: 0.15s;
    }

    .timeline-item.active .timeline-dot {
      background: #3a9a65;
      box-shadow: 0 0 0 2px #3a9a65;
    }

    .timeline-content {
      display: flex;
      flex-direction: column;
    }

    .timeline-date {
      font-size: 13px;
      font-weight: 500;
      color: #1f4a33;
      line-height: 1.3;
    }

    .timeline-time {
      font-size: 11px;
      color: #6d9f82;
      letter-spacing: 0.2px;
    }

    /* ===== 右侧列表 ===== */
    .list-area {
      flex: 1;
      padding: 24px 32px 32px 32px;
      background: transparent;
      overflow-y: auto;
      max-height: 580px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .list-header h2 {
      font-size: 16px;
      font-weight: 500;
      color: #1f4a33;
    }

    .list-header .count {
      font-size: 13px;
      color: #5a8f72;
      background: rgba(60, 180, 110, 0.08);
      padding: 2px 14px;
      border-radius: 30px;
      border: 1px solid rgba(60, 180, 110, 0.06);
    }

    .entry-card {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(100, 190, 140, 0.15);
      border-radius: 20px;
      padding: 18px 24px;
      margin-bottom: 14px;
      transition: all 0.2s;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(60, 140, 100, 0.02);
    }

    .entry-card:hover {
      border-color: rgba(60, 180, 110, 0.3);
      background: rgba(255, 255, 255, 0.7);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(60, 140, 100, 0.06);
    }

    .entry-card .title {
      font-size: 18px;
      font-weight: 600;
      color: #1f4a33;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .entry-card .title .emoji {
      font-size: 20px;
    }

    .entry-card .preview {
      margin-top: 8px;
      font-size: 15px;
      color: #3a6b55;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .entry-card .meta {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #6d9f82;
      border-top: 1px solid rgba(100, 190, 140, 0.08);
      padding-top: 12px;
    }

    .entry-card .meta .summary-badge {
      background: rgba(60, 180, 110, 0.08);
      padding: 2px 14px;
      border-radius: 40px;
      color: #2a6b47;
      font-weight: 450;
      border: 1px solid rgba(60, 180, 110, 0.06);
    }

    /* ===== 详情弹窗 ===== */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 70, 50, 0.2);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .detail-overlay.open {
      display: flex;
    }

    .detail-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      max-width: 700px;
      width: 100%;
      border-radius: 32px;
      padding: 32px 36px;
      box-shadow: 0 40px 80px rgba(30, 80, 55, 0.12);
      animation: slideUp 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(100, 190, 140, 0.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-panel .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 24px;
      color: #6d9f82;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 40px;
      transition: 0.1s;
    }
    .detail-panel .close-btn:hover {
      background: rgba(60, 180, 110, 0.06);
      color: #1f4a33;
    }

    .detail-panel .detail-title {
      font-size: 26px;
      font-weight: 600;
      margin: 8px 0 16px 0;
      color: #1f4a33;
    }

    .detail-panel .detail-content {
      background: rgba(240, 250, 243, 0.5);
      padding: 20px 24px;
      border-radius: 20px;
      font-size: 16px;
      line-height: 1.6;
      color: #1f4a33;
      margin: 16px 0 24px 0;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid rgba(100, 190, 140, 0.06);
    }

    .detail-panel .detail-summary {
      background: rgba(60, 180, 110, 0.06);
      padding: 18px 24px;
      border-radius: 20px;
      border-left: 4px solid #3a9a65;
      margin: 8px 0 20px 0;
    }

    .detail-panel .detail-summary strong {
      display: block;
      font-size: 13px;
      color: #3a6b55;
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .detail-panel .detail-summary p {
      font-size: 16px;
      color: #1f4a33;
      margin: 0;
      line-height: 1.5;
    }

    .detail-panel .detail-timestamp {
      font-size: 13px;
      color: #6d9f82;
      margin-top: 8px;
    }

    /* ===== 新建表单 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 70, 50, 0.2);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      max-width: 600px;
      width: 100%;
      padding: 32px 36px;
      box-shadow: 0 40px 80px rgba(30, 80, 55, 0.12);
      animation: slideUp 0.25s ease;
      border: 1px solid rgba(100, 190, 140, 0.12);
    }

    .modal-box h3 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #1f4a33;
    }

    .modal-box label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #2a6b47;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    .modal-box input,
    .modal-box textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(100, 190, 140, 0.2);
      border-radius: 16px;
      font-size: 15px;
      transition: 0.15s;
      background: rgba(255, 255, 255, 0.6);
    }

    .modal-box input:focus,
    .modal-box textarea:focus {
      outline: none;
      border-color: #3a9a65;
      background: white;
      box-shadow: 0 0 0 4px rgba(60, 180, 110, 0.08);
    }

    .modal-box textarea {
      min-height: 120px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6d9f82;
    }

    .empty-state .big-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 760px) {
      .main {
        flex-direction: column;
      }
      .timeline {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(100, 190, 140, 0.1);
        max-height: 120px;
        display: flex;
        flex-wrap: nowrap;
        gap: 10px;
        padding: 12px 16px;
        overflow-x: auto;
        background: rgba(240, 250, 243, 0.3);
      }
      .timeline-title {
        display: none;
      }
      .timeline-item {
        flex-shrink: 0;
        margin-bottom: 0;
        padding: 4px 12px 4px 8px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 40px;
        border: 1px solid rgba(100, 190, 140, 0.08);
      }
      .timeline-item.active {
        background: rgba(60, 180, 110, 0.08);
        border-color: #3a9a65;
      }
      .timeline-dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
      }
      .timeline-date {
        font-size: 12px;
      }
      .timeline-time {
        font-size: 10px;
      }
      .header {
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px 18px;
      }
      .list-area {
        padding: 16px;
      }
      .detail-panel {
        padding: 24px;
      }
      .modal-box {
        padding: 24px;
      }
      .header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- 头部 -->
  <header class="header">
    <h1>
      <span class="icon-leaf">🌱</span>
      灵感备忘录
      <span>新芽·时间轴</span>
    </h1>
    <div class="actions">
      <button class="btn btn-primary" id="newEntryBtn">＋ 新记录</button>
      <button class="btn btn-outline" id="syncBtn">⟳ 同步</button>
    </div>
  </header>

  <div class="main">
    <!-- 时间轴 (左侧) -->
    <div class="timeline" id="timelineContainer">
      <div class="timeline-title">⏳ 时间轴</div>
      <!-- 动态渲染 -->
    </div>

    <!-- 列表区域 -->
    <div class="list-area" id="listArea">
      <div class="list-header">
        <h2>🌿 所有灵感</h2>
        <span class="count" id="entryCount">0 条</span>
      </div>
      <div id="entryList">
        <!-- 动态渲染 -->
      </div>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel">
    <button class="close-btn" id="closeDetail">✕</button>
    <div class="detail-title" id="detailTitle">标题</div>
    <div class="detail-content" id="detailContent">内容</div>
    <div class="detail-summary">
      <strong>🧠 AI 总结 (只记录不联想)</strong>
      <p id="detailSummary">总结占位</p>
    </div>
    <div class="detail-timestamp" id="detailTimestamp">2026-08-11 14:30</div>
  </div>
</div>

<!-- 新建记录弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>✍️ 记录灵感</h3>
    <label>标题</label>
    <input type="text" id="inputTitle" placeholder="给灵感起个标题…" />

    <label>内容</label>
    <textarea id="inputContent" placeholder="写下你突如其来的想法…"></textarea>

    <div class="modal-actions">
      <button class="btn btn-outline" id="cancelModalBtn">取消</button>
      <button class="btn btn-primary" id="saveEntryBtn">💾 保存并生成总结</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- 数据 ----------
    let entries = [];

    function loadData() {
      const stored = localStorage.getItem('inspiration_entries_green');
      if (stored) {
        try {
          entries = JSON.parse(stored);
        } catch {
          entries = [];
        }
      } else {
        entries = [
          {
            id: Date.now() - 86400000 * 2,
            title: '关于自动压缩的新想法',
            content: '我发现自动压缩的关键不是压缩本身，而是压缩后如何保持因果链的完整性。',
            summary: '用户认为自动压缩的核心在于保持因果链的完整性，而非压缩本身。',
            timestamp: new Date(Date.now() - 86400000 * 2).toLocaleString('zh-CN', { hour12: false })
          },
          {
            id: Date.now() - 86400000,
            title: '产品架构的底层逻辑',
            content: '用户需要的是确定性，而不是灵活性。确定性带来信任，灵活性带来困惑。',
            summary: '用户强调产品应优先提供确定性，灵活性可能削弱用户信任。',
            timestamp: new Date(Date.now() - 86400000).toLocaleString('zh-CN', { hour12: false })
          },
          {
            id: Date.now() - 3600000 * 5,
            title: '记忆与压缩的边界',
            content: '摘要应该保留因果链，而不是孤立事件。压缩应当保留决策路径。',
            summary: '用户认为摘要应保留因果链和决策路径，而非仅记录孤立事件。',
            timestamp: new Date(Date.now() - 3600000 * 5).toLocaleString('zh-CN', { hour12: false })
          }
        ];
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('inspiration_entries_green', JSON.stringify(entries));
    }

    // ---------- AI 总结 (只记录，不联想) ----------
    function generateSummary(content) {
      if (!content || content.trim().length === 0) return '（空内容）';
      const trimmed = content.trim();
      const firstSentence = trimmed.split(/[。！？；\n]/).filter(s => s.trim().length > 0)[0];
      if (firstSentence && firstSentence.length <= 30) {
        return `用户认为：${firstSentence}。`;
      }
      const short = trimmed.slice(0, 30);
      return `用户认为：${short}${trimmed.length > 30 ? '…' : ''}`;
    }

    // ---------- 渲染 ----------
    function render() {
      const sorted = [...entries].sort((a, b) => b.id - a.id);

      const listEl = document.getElementById('entryList');
      const countEl = document.getElementById('entryCount');
      countEl.textContent = `${entries.length} 条`;

      if (entries.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="big-icon">🌱</div>
            <p>还没有灵感记录<br>点击「新记录」开始吧</p>
          </div>
        `;
      } else {
        listEl.innerHTML = sorted.map(entry => `
          <div class="entry-card" data-id="${entry.id}">
            <div class="title"><span class="emoji">💡</span> ${escapeHtml(entry.title || '未命名')}</div>
            <div class="preview">${escapeHtml(entry.content || '')}</div>
            <div class="meta">
              <span>${entry.timestamp || '未知时间'}</span>
              <span class="summary-badge">🧠 有总结</span>
            </div>
          </div>
        `).join('');
      }

      // 时间轴
      const timelineContainer = document.getElementById('timelineContainer');
      let timelineHtml = `<div class="timeline-title">⏳ 时间轴</div>`;
      if (sorted.length === 0) {
        timelineHtml += `<div style="padding: 12px; color: #6d9f82; font-size: 13px;">暂无记录</div>`;
      } else {
        const recent = sorted.slice(0, 12);
        timelineHtml += recent.map(entry => {
          const dateObj = new Date(entry.id);
          const dateStr = dateObj.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
          const timeStr = dateObj.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
          return `
            <div class="timeline-item" data-id="${entry.id}">
              <div class="timeline-dot"></div>
              <div class="timeline-content">
                <div class="timeline-date">${dateStr}</div>
                <div class="timeline-time">${timeStr}</div>
              </div>
            </div>
          `;
        }).join('');
      }
      timelineContainer.innerHTML = timelineHtml;

      // 点击事件
      document.querySelectorAll('.entry-card').forEach(card => {
        card.addEventListener('click', function() {
          const id = Number(this.dataset.id);
          const entry = entries.find(e => e.id === id);
          if (entry) openDetail(entry);
        });
      });

      document.querySelectorAll('.timeline-item').forEach(item => {
        item.addEventListener('click', function() {
          const id = Number(this.dataset.id);
          const entry = entries.find(e => e.id === id);
          if (entry) openDetail(entry);
        });
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ---------- 详情 ----------
    function openDetail(entry) {
      document.getElementById('detailTitle').textContent = entry.title || '未命名';
      document.getElementById('detailContent').textContent = entry.content || '（无内容）';
      document.getElementById('detailSummary').textContent = entry.summary || generateSummary(entry.content);
      document.getElementById('detailTimestamp').textContent = entry.timestamp || '未知时间';
      document.getElementById('detailOverlay').classList.add('open');
    }

    // ---------- 新建 ----------
    function openModal() {
      document.getElementById('modalOverlay').classList.add('open');
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputContent').value = '';
      document.getElementById('inputTitle').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function saveNewEntry() {
      const title = document.getElementById('inputTitle').value.trim() || '未命名灵感';
      const content = document.getElementById('inputContent').value.trim();
      if (!content) {
        alert('请至少输入一些内容');
        return;
      }

      const summary = generateSummary(content);
      const now = new Date();
      const timestamp = now.toLocaleString('zh-CN', { hour12: false });

      const newEntry = {
        id: Date.now(),
        title: title,
        content: content,
        summary: summary,
        timestamp: timestamp
      };

      entries.push(newEntry);
      saveData();
      render();
      closeModal();
      openDetail(newEntry);
    }

    // ---------- 初始化 ----------
    document.addEventListener('DOMContentLoaded', function() {
      loadData();
      render();

      document.getElementById('newEntryBtn').addEventListener('click', openModal);
      document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
      document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });
      document.getElementById('saveEntryBtn').addEventListener('click', saveNewEntry);

      document.getElementById('closeDetail').addEventListener('click', function() {
        document.getElementById('detailOverlay').classList.remove('open');
      });
      document.getElementById('detailOverlay').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('open');
      });

      document.getElementById('syncBtn').addEventListener('click', function() {
        render();
        this.textContent = '✓ 已同步';
        setTimeout(() => { this.textContent = '⟳ 同步'; }, 1200);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          document.getElementById('detailOverlay').classList.remove('open');
          closeModal();
        }
      });
    });
  })();
</script>
</body>
</html>
